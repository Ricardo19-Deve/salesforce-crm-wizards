<template>
    <template lwc:if={loading}>
        <div class="doc-empty">Loading BRD…</div>
    </template>

    <template lwc:elseif={hasBrd}>
        <!-- ---------------------------------------------------------- Header -->
        <div class="doc-card doc-header">
            <div class="doc-header-top">
                <div class="doc-title-block">
                    <div class="doc-eyebrow">Business Requirements Document &amp; Solution Design</div>
                    <input
                        class="title-input"
                        type="text"
                        maxlength="80"
                        data-field="Name"
                        value={brd.Name}
                        disabled={locked}
                        onblur={handleBrdField}
                        aria-label="Document name"
                    />
                </div>
                <div class="doc-actions">
                    <template lwc:if={saving}><span class="saving" role="status">Saving…</span></template>
                    <span class={statusClass}>{status}</span>
                    <a class="btn btn-sm" href={pdfUrl} target="_blank" rel="noopener">
                        <lightning-icon icon-name="doctype:pdf" size="x-small"></lightning-icon>
                        PDF
                    </a>
                    <a class="btn btn-sm" href={wordUrl} target="_blank" rel="noopener">
                        <lightning-icon icon-name="doctype:word" size="x-small"></lightning-icon>
                        Word
                    </a>
                    <template lwc:if={canDelete}>
                        <button class="icon-btn" title="Delete BRD" aria-label="Delete BRD" onclick={handleDeleteBrd}>
                            <lightning-icon icon-name="utility:delete" size="x-small"></lightning-icon>
                        </button>
                    </template>
                </div>
            </div>
            <div class="grid-3">
                <div>
                    <label class="field-label">PBI ID</label>
                    <input
                        class="field-input"
                        type="text"
                        maxlength="50"
                        data-field="PBI_ID__c"
                        value={brd.PBI_ID__c}
                        placeholder="PBI-0000"
                        disabled={locked}
                        onblur={handleBrdField}
                    />
                </div>
                <div>
                    <label class="field-label">Business area</label>
                    <input
                        class="field-input"
                        type="text"
                        maxlength="120"
                        data-field="Business_Area__c"
                        value={brd.Business_Area__c}
                        disabled={locked}
                        onblur={handleBrdField}
                    />
                </div>
                <div>
                    <label class="field-label">Version</label>
                    <div class="readonly-value">{brd.Version__c}</div>
                </div>
            </div>

            <template lwc:if={banner}>
                <div class={banner.cls} role="status">
                    <lightning-icon icon-name={banner.icon} size="x-small"></lightning-icon>
                    <span>{banner.text}</span>
                </div>
            </template>

            <div class="workflow">
                <template lwc:if={myPendingCount}>
                    <span class="mine-chip">{myPendingLabel}</span>
                </template>
                <template lwc:if={canReopen}>
                    <button class="btn btn-sm" disabled={saving} onclick={handleReopen}>
                        <lightning-icon icon-name="utility:unlock" size="xx-small"></lightning-icon>
                        {reopenLabel}
                    </button>
                </template>
                <template lwc:if={canRequest}>
                    <button class="btn btn-sm btn-primary" disabled={saving} onclick={handleRequest}>
                        <lightning-icon icon-name="utility:send" size="xx-small" variant="inverse"></lightning-icon>
                        Request sign-off
                    </button>
                </template>
            </div>
        </div>

        <div class="doc-section-title">Section One (BRD)</div>

        <!-- ---------------------------------------------------------- 1 -->
        <div class="doc-card">
            <h3 class="doc-h"><span class="num">1</span> Business Change Initiator and Impacted Users</h3>
            <div class="grid-3">
                <div>
                    <label class="field-label">Business Analyst</label>
                    <input
                        class="field-input"
                        type="text"
                        maxlength="120"
                        data-field="Business_Analyst__c"
                        value={brd.Business_Analyst__c}
                        disabled={locked}
                        onblur={handleBrdField}
                    />
                </div>
                <div>
                    <label class="field-label">Business Requestor</label>
                    <input
                        class="field-input"
                        type="text"
                        maxlength="120"
                        data-field="Business_Requestor__c"
                        value={brd.Business_Requestor__c}
                        disabled={locked}
                        onblur={handleBrdField}
                    />
                </div>
                <div>
                    <label class="field-label">Impacted Users</label>
                    <input
                        class="field-input"
                        type="text"
                        maxlength="255"
                        data-field="Impacted_Users__c"
                        value={brd.Impacted_Users__c}
                        disabled={locked}
                        onblur={handleBrdField}
                    />
                </div>
            </div>
        </div>

        <!-- ---------------------------------------------------------- 2 -->
        <div class="doc-card">
            <h3 class="doc-h"><span class="num">2</span> Known Systems Impacted</h3>
            <input
                class="field-input"
                type="text"
                maxlength="255"
                data-field="Systems_Impacted__c"
                value={brd.Systems_Impacted__c}
                placeholder="Comma separated, e.g. Salesforce.com, SAP"
                aria-label="Known systems impacted"
                disabled={locked}
                onblur={handleBrdField}
            />
            <div class="chips">
                <template for:each={systemChips} for:item="chip">
                    <span key={chip} class="chip">{chip}</span>
                </template>
            </div>
        </div>

        <!-- ---------------------------------------------------------- 3 -->
        <div class="doc-card">
            <div class="doc-h-row">
                <h3 class="doc-h"><span class="num">3</span> Business Requirements</h3>
                <template lwc:if={editable}>
                    <button class="btn btn-sm" onclick={handleAddRequirement}>
                        <lightning-icon icon-name="utility:add" size="xx-small"></lightning-icon>
                        Add requirement
                    </button>
                </template>
            </div>
            <p class="hint">One bullet per line. Acceptance criteria are used to generate test cases automatically.</p>
            <template for:each={requirements} for:item="r">
                <div key={r.Id} class="req">
                    <div class="req-head">
                        <span class="req-num">{r.Name}</span>
                        <template lwc:if={editable}>
                            <button
                                class="icon-btn icon-btn-sm"
                                title="Delete requirement"
                                aria-label="Delete requirement"
                                data-id={r.Id}
                                onclick={handleDeleteRequirement}
                            >
                                <lightning-icon icon-name="utility:close" size="xx-small"></lightning-icon>
                            </button>
                        </template>
                    </div>
                    <div class="grid-2">
                        <div>
                            <label class="field-label">Requirement</label>
                            <textarea
                                class="field-textarea"
                                data-id={r.Id}
                                data-field="Requirement__c"
                                data-text={r.Requirement__c}
                                disabled={locked}
                                onblur={handleRequirementField}
                            ></textarea>
                        </div>
                        <div>
                            <label class="field-label">Acceptance Criteria</label>
                            <textarea
                                class="field-textarea"
                                data-id={r.Id}
                                data-field="Acceptance_Criteria__c"
                                data-text={r.Acceptance_Criteria__c}
                                disabled={locked}
                                onblur={handleRequirementField}
                            ></textarea>
                        </div>
                        <div>
                            <label class="field-label">System(s) Impacted</label>
                            <input
                                class="field-input"
                                type="text"
                                maxlength="255"
                                data-id={r.Id}
                                data-field="Systems_Impacted__c"
                                value={r.Systems_Impacted__c}
                                disabled={locked}
                                onblur={handleRequirementField}
                            />
                        </div>
                        <div>
                            <label class="field-label">Additional Information</label>
                            <input
                                class="field-input"
                                type="text"
                                data-id={r.Id}
                                data-field="Additional_Info__c"
                                value={r.Additional_Info__c}
                                disabled={locked}
                                onblur={handleRequirementField}
                            />
                        </div>
                    </div>
                </div>
            </template>
        </div>

        <!-- ---------------------------------------------------------- 4 -->
        <div class="doc-card">
            <h3 class="doc-h"><span class="num">4</span> Sign-Off</h3>
            <p class="hint">
                Name an approver for each role (project members only). Requesting sign-off locks the document and
                notifies them; each approver decides with their own login, so names and dates are recorded by the
                system.
            </p>
            <div class="signoff">
                <template for:each={brdSignOffRows} for:item="s">
                    <div key={s.Id} class={s.rowClass}>
                        <div class="signoff-main">
                            <span class="signoff-role">{s.Role__c}</span>
                            <div class="signoff-approver">
                                <template lwc:if={s.showPicker}>
                                    <c-project-board-select
                                        class="approver-select"
                                        label={s.Role__c}
                                        data-id={s.Id}
                                        onchange={handleApprover}
                                        options={s.approverOptions}
                                    ></c-project-board-select>
                                </template>
                                <template lwc:else>
                                    <template lwc:if={s.hasApprover}>
                                        <span class="avatar avatar-sm" style={s.approverStyle}
                                            >{s.approverInitials}</span
                                        >
                                    </template>
                                    <span class="approver-name">{s.approverName}</span>
                                </template>
                            </div>
                            <div class="signoff-state">
                                <span class={s.pillClass}>{s.Status__c}</span>
                                <template lwc:if={s.decidedAt}>
                                    <lightning-relative-date-time value={s.decidedAt}></lightning-relative-date-time>
                                </template>
                            </div>
                            <template lwc:if={editable}>
                                <label class="switch switch-sm">
                                    <input
                                        type="checkbox"
                                        checked={s.notRequired}
                                        data-id={s.Id}
                                        onchange={handleNotRequired}
                                    />
                                    <span>Not required</span>
                                </label>
                            </template>
                        </div>
                        <template lwc:if={s.Comments__c}>
                            <p class="signoff-comment">“{s.Comments__c}”</p>
                        </template>
                        <template lwc:if={s.isMine}>
                            <div class="decision">
                                <textarea
                                    class="field-textarea"
                                    data-id={s.Id}
                                    placeholder="Comment (required when you request changes)"
                                    aria-label={s.commentLabel}
                                    oninput={handleDecisionComment}
                                ></textarea>
                                <div class="decision-actions">
                                    <button
                                        class="btn btn-sm btn-approve"
                                        data-id={s.Id}
                                        disabled={saving}
                                        onclick={handleApprove}
                                    >
                                        Approve
                                    </button>
                                    <button
                                        class="btn btn-sm btn-reject"
                                        data-id={s.Id}
                                        disabled={saving}
                                        onclick={handleReject}
                                    >
                                        Request changes
                                    </button>
                                </div>
                            </div>
                        </template>
                    </div>
                </template>
            </div>
        </div>

        <div class="doc-section-title">Section Two (Solution Design)</div>

        <!-- ---------------------------------------------------------- 5 -->
        <div class="doc-card">
            <h3 class="doc-h"><span class="num">5</span> Solution</h3>
            <template for:each={requirements} for:item="r">
                <div key={r.Id} class="req">
                    <div class="req-head"><span class="req-num">{r.Name}</span></div>
                    <div class="grid-solution">
                        <div>
                            <label class="field-label">Solution</label>
                            <textarea
                                class="field-textarea"
                                data-id={r.Id}
                                data-field="Solution__c"
                                data-text={r.Solution__c}
                                placeholder="e.g. Update flow Automatic Case Reopening…"
                                disabled={locked}
                                onblur={handleRequirementField}
                            ></textarea>
                        </div>
                        <div>
                            <label class="field-label">System(s) Impacted</label>
                            <input
                                class="field-input"
                                type="text"
                                maxlength="255"
                                data-id={r.Id}
                                data-field="Solution_Systems__c"
                                value={r.Solution_Systems__c}
                                disabled={locked}
                                onblur={handleRequirementField}
                            />
                        </div>
                    </div>
                </div>
            </template>
            <div class="signoff">
                <template for:each={solutionSignOffRows} for:item="s">
                    <div key={s.Id} class={s.rowClass}>
                        <div class="signoff-main">
                            <span class="signoff-role">{s.Role__c}</span>
                            <div class="signoff-approver">
                                <template lwc:if={s.showPicker}>
                                    <c-project-board-select
                                        class="approver-select"
                                        label={s.Role__c}
                                        data-id={s.Id}
                                        onchange={handleApprover}
                                        options={s.approverOptions}
                                    ></c-project-board-select>
                                </template>
                                <template lwc:else>
                                    <template lwc:if={s.hasApprover}>
                                        <span class="avatar avatar-sm" style={s.approverStyle}
                                            >{s.approverInitials}</span
                                        >
                                    </template>
                                    <span class="approver-name">{s.approverName}</span>
                                </template>
                            </div>
                            <div class="signoff-state">
                                <span class={s.pillClass}>{s.Status__c}</span>
                                <template lwc:if={s.decidedAt}>
                                    <lightning-relative-date-time value={s.decidedAt}></lightning-relative-date-time>
                                </template>
                            </div>
                            <template lwc:if={editable}>
                                <label class="switch switch-sm">
                                    <input
                                        type="checkbox"
                                        checked={s.notRequired}
                                        data-id={s.Id}
                                        onchange={handleNotRequired}
                                    />
                                    <span>Not required</span>
                                </label>
                            </template>
                        </div>
                        <template lwc:if={s.Comments__c}>
                            <p class="signoff-comment">“{s.Comments__c}”</p>
                        </template>
                        <template lwc:if={s.isMine}>
                            <div class="decision">
                                <textarea
                                    class="field-textarea"
                                    data-id={s.Id}
                                    placeholder="Comment (required when you request changes)"
                                    aria-label={s.commentLabel}
                                    oninput={handleDecisionComment}
                                ></textarea>
                                <div class="decision-actions">
                                    <button
                                        class="btn btn-sm btn-approve"
                                        data-id={s.Id}
                                        disabled={saving}
                                        onclick={handleApprove}
                                    >
                                        Approve
                                    </button>
                                    <button
                                        class="btn btn-sm btn-reject"
                                        data-id={s.Id}
                                        disabled={saving}
                                        onclick={handleReject}
                                    >
                                        Request changes
                                    </button>
                                </div>
                            </div>
                        </template>
                    </div>
                </template>
            </div>
        </div>

        <div class="doc-card">
            <c-project-board-attachments
                record-id={brd.Id}
                read-only={locked}
                heading="Solution screenshots — included in the PDF"
                hint="Drop Flow / configuration screenshots here"
                accept=".png,.jpg,.jpeg,.gif"
            ></c-project-board-attachments>
        </div>
    </template>

    <template lwc:else>
        <div class="doc-card doc-start">
            <span class="doc-orb">
                <lightning-icon
                    icon-name="utility:richtextbulletedlist"
                    size="small"
                    variant="inverse"
                ></lightning-icon>
            </span>
            <h3>No BRD for this issue yet</h3>
            <p>
                Create the Business Requirements Document &amp; Solution Design from the BRD template. It is pre-filled
                with the issue key and description, and exports to PDF and Word.
            </p>
            <template lwc:if={canCreate}>
                <button class="btn btn-primary" disabled={saving} onclick={handleCreate}>
                    Create BRD from template
                </button>
            </template>
        </div>
    </template>
</template>
